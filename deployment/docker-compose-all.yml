x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "my_secret_key"
    SPARK_MASTER_URL: spark://spark-master:7077
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    _AIRFLOW_DB_MIGRATE: "true"
    _AIRFLOW_WWW_USER_CREATE: "true"
    _AIRFLOW_WWW_USER_USERNAME: "airflow"
    _AIRFLOW_WWW_USER_PASSWORD: "airflow"
  volumes:
    - ../batch/airflow/dags:/opt/airflow/dags
    - ../batch/airflow/logs:/opt/airflow/logs
    - ../batch/airflow/plugins:/opt/airflow/plugins
    - ../batch/spark_jobs:/opt/airflow/batch/spark_jobs
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - glowpipe_network
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - glowpipe_network

  redis:
    image: redis:latest
    container_name: airflow_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - glowpipe_network

  spark-master:
    image: apache/spark-py:latest
    container_name: spark_master
    user: root
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    ports:
      - "8083:8080"
    networks:
      - glowpipe_network
    volumes:
      - ../batch/spark_jobs:/opt/spark/work-dir/batch/spark_jobs

  spark-worker:
    image: apache/spark-py:latest
    container_name: spark_worker
    user: root
    environment:
      SPARK_WORKER_DIR: /tmp/spark-work
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --cores 1
      --memory 1G
      --webui-port 8081
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    networks:
      - glowpipe_network
    volumes:
      - ../batch/spark_jobs:/opt/spark/work-dir/batch/spark_jobs

  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    command: version
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: airflow webserver
    ports:
      - "8082:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started

  airflow-worker:
    <<: *airflow-common
    container_name: airflow_worker
    command: airflow celery worker
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: glowpipe_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - glowpipe_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: glowpipe_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9101
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - glowpipe_network

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: glowpipe_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic user_events --replication-factor 1 --partitions 3

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic product_safety --replication-factor 1 --partitions 3

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic ingredient_alerts --replication-factor 1 --partitions 3

      echo 'Topics created:'
      kafka-topics --bootstrap-server kafka:9092 --list
      "
    networks:
      - glowpipe_network

  streaming_postgres:
    image: postgres:13
    container_name: glowpipe_streaming_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: glowpipe_streaming
    volumes:
      - streaming_postgres_data:/var/lib/postgresql/data
      - ../streaming/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d glowpipe_streaming"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - glowpipe_network

  grafana:
    image: grafana/grafana:10.2.0
    container_name: glowpipe_grafana
    depends_on:
      streaming_postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../streaming/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - glowpipe_network

  kafka-producer:
    image: python:3.11-slim
    container_name: glowpipe_kafka_producer
    depends_on:
      kafka:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ../streaming/kafka:/app
    command: >
      sh -c "pip install kafka-python --quiet &&
             python producer.py --mode both --rate 200"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - glowpipe_network
    restart: on-failure

volumes:
  postgres_data:
  streaming_postgres_data:
  grafana_data:

networks:
  glowpipe_network:
    driver: bridge